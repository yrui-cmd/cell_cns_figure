name: Client tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cell_cns_figure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r cell_cns_figure/requirements.txt
      - name: Test route 1
        working-directory: cell_cns_figure
        run: python -X utf8 -m unittest discover -s backends/fig1/tests -v
      - name: Test route 2
        working-directory: cell_cns_figure
        run: python -X utf8 -m unittest discover -s backends/fig2/tests -v
      - name: Test bundled native layout
        working-directory: cell_cns_figure
        run: python -X utf8 -m unittest discover -s native/tests -v
